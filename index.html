<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Tribute to Love | Mother's Day Cinematic</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&display=swap"
        rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
</head>

<body>
    <div id="experience-container">
        <!-- UI Overlay -->
        <div id="ui-layer">
            <!-- Initial Screen -->
            <div id="intro-screen" class="overlay">
                <div class="glass-panel">
                    <h1 class="glow-text">The Journey of a Heart</h1>
                    <p class="subtitle">A 2-Minute Cinematic Tribute</p>
                    <button id="start-journey-btn" class="premium-btn">Start Journey</button>
                    <p class="audio-hint">Turn on sound for the best experience</p>
                </div>
            </div>

            <!-- Subtitles Layer -->
            <div id="subtitle-layer" class="overlay hidden">
                <div class="subtitle-container">
                    <p id="subtitle-text"></p>
                    <button id="next-btn" class="next-btn hidden">Continue &rarr;</button>
                </div>
            </div>


            <!-- Final Message -->
            <div id="final-screen" class="overlay hidden">
                <div class="glass-panel">
                    <h2 class="letter-header">To My Dear Mom</h2>
                    <p class="final-text">Thank you for being my light, my guide, and my heart. Every beat of this heart is a tribute to your love.</p>
                    <p class="sig">Happy Mother's Day</p>
                    <button id="restart-btn" class="secondary-btn">Replay Journey</button>
                </div>
            </div>

            <!-- Progress Bar -->
            <div id="progress-container" class="hidden">
                <div id="progress-bar"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
